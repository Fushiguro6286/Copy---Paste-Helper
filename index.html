<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipboard Helper – Premium UI</title>
<link rel="stylesheet" href="style.css">

</head>

<body class="light">

<div class="container">
    <h2>📋 Copy–Paste Helper</h2>

    <textarea id="box" placeholder="Type something..."></textarea>

    <button id="copyBtn">Copy</button>
    <button id="copySelBtn">Copy Selected</button>
    <button id="pasteBtn">Paste</button>
    <button id="clearBtn">Clear</button>
    <button id="downloadBtn">Download .txt</button>

    <div id="status"></div>

    <button class="toggle" id="toggleDark">🌙 Toggle Dark Mode</button>
</div>

<script src="script.js"></script>


</body>
</html>
